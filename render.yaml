services:
  - type: web
    name: documind-api
    runtime: python
    rootDir: faq-bot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_STARTUP_TIMEOUT
        value: "30"
      - key: ALLOW_MODEL_DOWNLOAD
        value: "true"
      # Render's free 512 MB instance cannot reliably hold PyTorch and the
      # sentence-transformer model. The API's lexical retriever keeps uploads
      # and grounded answers available without loading that stack at runtime.
      - key: USE_EMBEDDINGS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
