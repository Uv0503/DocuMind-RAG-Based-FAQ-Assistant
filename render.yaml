services:
  - type: web
    name: documind-api
    runtime: python
    rootDir: faq-bot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_STARTUP_TIMEOUT
        value: "30"
      - key: ALLOW_MODEL_DOWNLOAD
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
